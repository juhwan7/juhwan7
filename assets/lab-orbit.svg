<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#f0f3f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#111827" flood-opacity=".10"/>
    </filter>
    <style>
      .title{font:700 29px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111827;letter-spacing:1px}
      .meta{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#667085}
      .node{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .lane{font:500 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#667085}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
      .drift{animation:dash 12s linear infinite}
      @keyframes pulse{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.58;transform:scale(1.08)}}
      @keyframes dash{to{stroke-dashoffset:-120}}
      @media (prefers-reduced-motion:reduce){.pulse,.drift{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <g stroke="#d7dbe3" stroke-width="2" stroke-dasharray="4 8" class="drift">
    <line x1="600" y1="235" x2="165" y2="112"/><line x1="600" y1="235" x2="600" y2="78"/>
    <line x1="600" y1="235" x2="1035" y2="112"/><line x1="600" y1="235" x2="1035" y2="358"/>
    <line x1="600" y1="235" x2="600" y2="392"/><line x1="600" y1="235" x2="165" y2="358"/>
  </g>
  <circle cx="600" cy="235" r="115" fill="#fff" stroke="#F97316" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="600" cy="235" r="128" fill="none" stroke="#8B5CF6" stroke-width="2" opacity=".28" class="pulse"/>
  <text x="600" y="217" text-anchor="middle" class="title">JUHWAN / LIVING LAB</text>
  <text x="600" y="247" text-anchor="middle" class="meta">EVOLUTION DAY 001</text>
  <text x="600" y="274" text-anchor="middle" class="meta">observe → build → falsify → recover → evolve</text>

  <circle cx="165" cy="112" r="49" fill="#fff7ed" stroke="#F97316" stroke-width="4"/>
  <circle cx="165" cy="112" r="60" fill="none" stroke="#8B5CF6" stroke-width="2" opacity=".35" class="pulse"/>
  <text x="165" y="107" text-anchor="middle" class="node">Stock AutoResearch</text><text x="165" y="129" text-anchor="middle" class="lane">MARKET AI</text>

  <circle cx="600" cy="78" r="34" fill="#fff" stroke="#aab0bc" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="600" y="73" text-anchor="middle" class="node">KMB Lab</text><text x="600" y="95" text-anchor="middle" class="lane">BEHAVIOR</text>

  <circle cx="1035" cy="112" r="34" fill="#fff" stroke="#aab0bc" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="1035" y="107" text-anchor="middle" class="node">Market Memo</text><text x="1035" y="129" text-anchor="middle" class="lane">MEMORY</text>

  <circle cx="1035" cy="358" r="34" fill="#fff" stroke="#aab0bc" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="1035" y="353" text-anchor="middle" class="node">STARSHIP</text><text x="1035" y="375" text-anchor="middle" class="lane">3D WEB</text>

  <circle cx="600" cy="392" r="34" fill="#fff" stroke="#aab0bc" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="600" y="387" text-anchor="middle" class="node">Rotation Talk</text><text x="600" y="409" text-anchor="middle" class="lane">SOCIAL GAME</text>

  <circle cx="165" cy="358" r="34" fill="#fff" stroke="#aab0bc" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="165" y="353" text-anchor="middle" class="node">Evo 3D Game</text><text x="165" y="375" text-anchor="middle" class="lane">AUTONOMOUS</text>

  <text x="35" y="440" class="meta">daily mutation bootstrapped · github.com/juhwan7</text>
</svg>
