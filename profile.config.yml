daily_questions:
  - 오늘 가장 많이 바뀐 코드는 기능을 늘렸나, 판단을 더 정확하게 만들었나?
  - 시스템이 멈췄을 때 사람을 부르지 않고 스스로 복구할 수 있는가?
  - 같은 실패를 다시 하지 않도록 실패 자체가 다음 입력으로 남고 있는가?
  - 데이터가 많아진 만큼 사용자의 판단 시간은 실제로 줄어들고 있는가?
  - AI가 서로 동의하는 것보다 서로 틀렸음을 찾아내는 구조가 더 강한가?
  - 지금 가장 복잡한 기능 하나를 지운다면 오히려 시스템이 좋아질 수 있는가?
  - 화면에서 5초 안에 지금 중요한 변화 하나를 찾을 수 있는가?
  - 자동화가 편의 기능을 넘어 프로젝트의 기억과 판단까지 이어받고 있는가?
  - 최신 기능보다 아직 검증되지 않은 가정 하나를 먼저 깨볼 수 있는가?
  - 프로젝트끼리 데이터를 공유하면 전혀 다른 실험에서 새 신호가 나올 수 있는가?
  - 살아있는 시스템의 기준을 커밋 수가 아니라 복구력으로 정의할 수 있는가?
  - 오늘 만든 기능이 일주일 뒤에도 필요한지 자동으로 다시 심사할 수 있는가?

