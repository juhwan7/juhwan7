name: Living Profile Mutation

on:
  schedule:
    - cron: "8 15 * * *"
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - profile.config.yml
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: living-profile
  cancel-in-progress: true

jobs:
  mutate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Generate living profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py

      - name: Commit only real mutations
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md assets/lab-orbit.svg; then
            echo "No mutation to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/lab-orbit.svg
          git commit -m "chore: mutate living profile"
          git push
